name: Multi-Platform Release

# Required GitHub Secrets:
#
# macOS bundles are built with cargo-bundle and ad-hoc signed (no Apple
# Developer certificate required). Users must right-click > Open on first
# launch, or run:
#   xattr -dr com.apple.quarantine Rustwave.app
#
# SOUNDCLOUD_CLIENT_ID: SoundCloud OAuth client ID
# SOUNDCLOUD_CLIENT_SECRET: SoundCloud OAuth client secret
# SOUNDCLOUD_REDIRECT_URL: SoundCloud OAuth redirect URL

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: ""

jobs:
  build:
    name: build-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos-intel
            os: macos-15-intel # Last available Intel runner image; retired ~Aug 2027
          - name: macos-arm
            os: macos-latest
          - name: linux-x64
            os: ubuntu-latest
          - name: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false # caching handled by rust-cache below

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config libssl-dev libdbus-1-dev

      - name: Install cargo-bundle (macOS)
        if: runner.os == 'macOS'
        run: cargo install cargo-bundle --locked

      - name: Create .env file
        shell: bash
        run: |
          cat > .env << EOF
          CLIENT_ID=${{ secrets.SOUNDCLOUD_CLIENT_ID }}
          CLIENT_SECRET=${{ secrets.SOUNDCLOUD_CLIENT_SECRET }}
          REDIRECT_URL=${{ secrets.SOUNDCLOUD_REDIRECT_URL }}
          EOF

      - name: Extract version from Cargo.toml
        shell: bash
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -n1 | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Build release binary
        if: runner.os != 'macOS'
        run: cargo build --release

      - name: Build and sign app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cargo bundle --release --format osx

          APP=target/release/bundle/osx/Rustwave.app
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"

          # Verify the signature
          codesign -v "$APP"
          codesign -dvv "$APP"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rustwave-windows/assets
          Copy-Item target/release/rustwave.exe rustwave-windows/
          Copy-Item .env rustwave-windows/
          Copy-Item -Recurse -Force assets/* rustwave-windows/assets/
          $archiveName = "rustwave-windows-v${{ env.VERSION }}.zip"
          Compress-Archive -Path rustwave-windows -DestinationPath $archiveName
          echo "ARCHIVE_NAME=$archiveName" >> $env:GITHUB_ENV

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ARCHIVE_NAME="rustwave-${{ matrix.name }}-v${VERSION}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C target/release/bundle/osx Rustwave.app
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p rustwave-${{ matrix.name }}/assets
          cp target/release/rustwave rustwave-${{ matrix.name }}/
          cp .env rustwave-${{ matrix.name }}/
          cp -r assets/* rustwave-${{ matrix.name }}/assets/
          chmod +x rustwave-${{ matrix.name }}/rustwave
          ARCHIVE_NAME="rustwave-${{ matrix.name }}-v${VERSION}.tar.gz"
          tar -czf "$ARCHIVE_NAME" rustwave-${{ matrix.name }}
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustwave-${{ matrix.name }}
          path: ${{ env.ARCHIVE_NAME }}
          retention-days: 30

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-cask:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rustwave-macos-*
          path: artifacts
          merge-multiple: true

      - name: Compute checksums and version
        id: meta
        run: |
          ARM_FILE=$(ls artifacts/rustwave-macos-arm-*.tar.gz)
          INTEL_FILE=$(ls artifacts/rustwave-macos-intel-*.tar.gz)
          VERSION=$(basename "$ARM_FILE" | sed -E 's/^rustwave-macos-arm-v(.+)\.tar\.gz$/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "arm_sha=$(shasum -a 256 "$ARM_FILE" | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "intel_sha=$(shasum -a 256 "$INTEL_FILE" | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Checkout tap repo
        uses: actions/checkout@v4
        with:
          repository: IxianPixel/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Write Casks/rustwave.rb
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          ARM_SHA: ${{ steps.meta.outputs.arm_sha }}
          INTEL_SHA: ${{ steps.meta.outputs.intel_sha }}
        run: |
          mkdir -p tap/Casks
          cat > tap/Casks/rustwave.rb << EOF
          cask "rustwave" do
            version "${VERSION}"

            on_arm do
              sha256 "${ARM_SHA}"
              url "https://github.com/IxianPixel/rustwave/releases/download/v#{version}/rustwave-macos-arm-v#{version}.tar.gz"
            end
            on_intel do
              sha256 "${INTEL_SHA}"
              url "https://github.com/IxianPixel/rustwave/releases/download/v#{version}/rustwave-macos-intel-v#{version}.tar.gz"
            end

            name "Rustwave"
            desc "SoundCloud music player built with Rust and Iced"
            homepage "https://github.com/IxianPixel/rustwave"

            app "Rustwave.app"

            # The app is ad-hoc signed (no Apple Developer ID / notarization),
            # so strip the quarantine flag on install to avoid Gatekeeper
            # blocking launch.
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/Rustwave.app"]
            end

            zap trash: [
              "~/Library/Application Support/com.malgra.rustwave",
              "~/Library/Saved Application State/com.rustwave.app.savedState",
            ]
          end
          EOF

      - name: Commit and push
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/rustwave.rb
          if git diff --staged --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "rustwave ${{ steps.meta.outputs.version }}"
            git push
          fi
